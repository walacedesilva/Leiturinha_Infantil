name: aprenda_a_ler
description: App infantil offline para aprender a ler juntando sílabas.
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: '>=3.2.0 <4.0.0'
  flutter: ">=3.19.0"

dependencies:
  flutter:
    sdk: flutter
  audioplayers: ^6.0.0
  flutter_tts: ^4.0.0
  shared_preferences: ^2.2.3
  provider: ^6.1.2
  flutter_animate: ^4.5.0
  lottie: ^3.1.0
  speech_to_text: ^7.0.0
  pdf: ^3.11.1
  printing: ^5.13.2
  share_plus: ^10.0.0
  path_provider: ^2.1.4
  intl: ^0.19.0
  webview_flutter: ^4.7.0
  screen_brightness: ^1.0.1
  app_settings: ^5.1.5
  google_sign_in: ^6.2.1
  http: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0
  flutter_launcher_icons: ^0.13.1

flutter:
  uses-material-design: true
  fonts:
    - family: Nunito
      fonts:
        - asset: assets/fonts/Nunito-Regular.ttf
          weight: 400
        - asset: assets/fonts/Nunito-Bold.ttf
          weight: 700
  assets:
    - assets/images/
    - assets/audio/syllables/
    - assets/audio/words/
    - assets/audio/sfx/
    - assets/animations/
    - assets/phonetic_reference_bank.json
    - assets/stories/
    - assets/portal_estelar/